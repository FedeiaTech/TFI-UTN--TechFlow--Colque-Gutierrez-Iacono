services:
  - type: web
    name: techflow-api
    runtime: python
    plan: free
    rootDir: backend
    branch: dev
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      # Session pooler de Supabase (puerto 5432). Se carga a mano en el
      # dashboard de Render: nunca se versiona.
      - key: DATABASE_URL
        sync: false
      # Firma de los tokens JWT. Render genera un valor aleatorio propio, así
      # producción no usa el valor por defecto que figura en el código.
      - key: SECRET_KEY
        generateValue: true
